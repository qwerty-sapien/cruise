    immutable_atomic_first_write: true
    exact_repeat_is_idempotent: true
    different_existing_bytes: rejected
    live_expected_digest_required_on_load: true
  capability_registry:
    maximum_bytes: 4194304
    maximum_entries: 4096
  exclusion_state:
    maximum_bytes: 262144
    maximum_entries: 4096
  rejected_capability_state:
    maximum_bytes: 1048576
    maximum_entries: 4096
  authentication_job:
    maximum_bytes: 1048576
    immutable_atomic_first_write: true
    exact_repeat_is_idempotent: true
    different_existing_bytes: rejected
  authority_file_reads:
    bounded: true
    regular_file_required: true
    symlink_forbidden: true
    canonical_repository_containment_required: true
    size_or_identity_drift_during_read: rejected
  encoded_payload_review:
    streaming_match_iteration: true
    candidate_wide_budget: true
    maximum_matches: 20
    maximum_encoded_bytes: 131072
    maximum_decoded_bytes: 65536
    budget_exhaustion: hard_rejection

exclusion:
