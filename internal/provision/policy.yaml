    - running
    - waiting_auth
    - blocked
    - failed
    - succeeded
  running_is_persisted_intermediate_state: true
  terminal_outcome_resolution:
    - succeeded
    - waiting_auth
    - failed
    - blocked
    - pending
  node_action_field_emitted: false
  node_capability_and_kind_required: true

private_state_io:
  store_authority:
    private_weakmap_binding: true
    requested_and_canonical_root_bound: true
    exact_capability_request_root_required_by_scheduler: true
