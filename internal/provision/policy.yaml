  request_authority:
    exact_live_opaque_capability_request_required: true
    request_id_must_match_run: true
    authority_sha256_must_match_run: true
    persisted_shape_or_digest_without_live_request_is_insufficient: true
  state_store_authority:
    opaque_private_binding_required: true
    exact_capability_request_repository_root_required: true
    forged_or_subclassed_store: rejected
    canonical_root_revalidated_before_each_read_or_write: true
    reviewed_prototype_methods_invoked_directly: true
    cross_repository_revocation_or_persistence: forbidden
  execution_brokers:
    plain_install_callback: forbidden
    plain_smoke_callback: forbidden
    opaque_install_execution_broker_required_for_install: true
    opaque_smoke_verification_broker_required_for_success: true
    plain_rollback_callback: forbidden
    opaque_rollback_broker_required_when_rollback_is_attempted: true
    plain_auth_callback: forbidden
    opaque_auth_verification_broker_required: true
  authenticated_candidate_revalidation:
    process_local_opaque_verified_auth_attestation: true
    binds:
      - exact_capability_request_and_repository_root
      - exact_auth_effect_authorization
      - request_id
      - provision_run_id
      - capability_node_id
      - candidate_identity
      - exact_auth_job_object
      - auth_job_sha256
      - server_name
      - required_scope
      - identity_policy
      - required_identity
      - persisted_state_path_and_sha256
      - parsed_state_and_host_evidence_sha256
    live_revalidation_before_activation: true
    persisted_resume_requires_fresh_exact_job_and_effect_authority: true
    drift_result: authenticated_candidate_authority_drift
  run_states_current_runtime:
