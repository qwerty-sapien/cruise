    - ready
    - running
    - waiting_auth
    - blocked
    - succeeded
    - failed
    - skipped
    - excluded
    - quarantined
  cycle_detection_before_execution: true
  auth_wait_blocks_dependents_only: true
  independent_ready_nodes_continue_if_host_schedules: true
  background_execution_claim_without_host_support: false

scheduler:
  capability_run_requires_nonempty_nodes: true
  zero_node_no_provisioning_run_supported: false
  immutable_dag_contract:
    persisted_separately_as: .cruise/internal/provision-runs/<run-id>/contract.yaml
    contract_sha256_persisted_on_run: true
    persisted_self_digest_is_authority: false
