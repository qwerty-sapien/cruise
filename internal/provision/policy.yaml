    - affected_evidence_sha256
    - waiver_qualified_closeout_when_allowed
  outcome_scope_or_requirement_change:
    - invalidate_affected_approval
    - revise_contract
    - obtain_required_reapproval

dag:
  node_id_pattern: "^CAP-[A-Z0-9][A-Z0-9-]*$"
  states:
