      approved_before_activation:
        const: true
      approval_sha256:
        pattern_ref: sha256
      expected_quality_or_cost_difference:
        type: string
        min_length: 1
      identity:
        type: string
      same_mandatory_acceptance_criteria:
        const: true
      same_protected_behavior:
        const: true
      same_permission_envelope:
        const: true
      equivalent_mandatory_evidence:
        type: boolean

  goal_effect_approval_token:
    kind: cruise-provision-goal-approval
    exposed_fields:
      - kind
      - decision_id
    serializable_authority: false
    opaque_process_local_binding:
      - exact_goal_capability_request_object
      - plan_sha256
      - permissions_sha256
      - approval_sha256
      - synchronous_current_digest_reader
    consumption_rechecks_current_digests:
      - plan_sha256
      - permissions_sha256
      - approval_sha256
    effects_requiring_token:
      - install
      - authenticate

  fallback_approval_token:
    kind: cruise-capability-fallback-approval
    exposed_fields:
      - kind
      - decision_id
    serializable_authority: false
    opaque_process_local_binding:
      - exact_capability_request_object
      - provision_run_id
      - capability_node_id
      - fallback_record_sha256
      - plan_sha256
      - permissions_sha256
      - synchronous_current_digest_reader
    consumption_rechecks_current_digests:
      - plan_sha256
      - permissions_sha256

  reconciliation_approval_token:
    exposed_kind:
      - cruise-provision-alternate_plan-approval
      - cruise-provision-weaker_evidence_waiver-approval
    serializable_authority: false
    opaque_process_local_binding:
      - exact_capability_request_object
      - provision_run_id
      - capability_node_id
      - reconciliation_kind
      - record_sha256
      - synchronous_current_digest_reader
    consumption_rechecks_current_digests:
      alternate_plan:
        - plan_sha256
        - approval_sha256
      weaker_evidence_waiver:
        - decision_sha256
        - affected_evidence_sha256
    asynchronous_digest_reader: fail_closed

  alternate_plan_decision:
    required:
      - id
      - approved
      - plan_sha256
      - approval_sha256
    properties:
      id:
        pattern_ref: decision
      approved:
        const: true
      plan_sha256:
        pattern_ref: sha256
      approval_sha256:
        pattern_ref: sha256

  weaker_evidence_waiver:
    required:
      - id
      - approved
      - waiver_qualified_closeout
      - decision_sha256
      - affected_evidence_sha256
    properties:
      id:
        pattern_ref: decision
      approved:
        const: true
      waiver_qualified_closeout:
        const: true
      decision_sha256:
        pattern_ref: sha256
      affected_evidence_sha256:
        pattern_ref: sha256

  reconciliation:
    kind: cruise_capability_reconciliation
    required:
      - reconciliation
    properties:
      reconciliation:
        type: object
        required:
          - outcome
        properties:
          outcome:
            enum_ref: reconciliation_outcome
          action:
            type: string
          mandatory_acceptance_preserved:
            type: boolean
          protected_behavior_preserved:
            type: boolean
          permission_envelope_preserved:
            type: boolean
          mandatory_evidence_preserved:
            type: boolean
          evidence_waiver_id:
            pattern_ref: decision
          decision_sha256:
            pattern_ref: sha256
          waiver_qualified_closeout:
            type: boolean
          decision_id:
            pattern_ref: decision
          plan_sha256:
            pattern_ref: sha256
          approval_invalidated:
            type: boolean
          reapproval_required:
            type: boolean
          reason:
            type: string

  rejected_capability_registry:
    kind: cruise_rejected_capabilities
    required:
      - schema_version
      - kind
      - rejected
    properties:
      schema_version:
        const: 1
      kind:
        const: cruise_rejected_capabilities
      rejected:
        type: array
        item_required:
          - repository
          - commit_sha
          - content_sha256
          - reason
          - security_findings
          - evaluated_at

state_paths:
  registry: .cruise/internal/caps.yaml
  runs: .cruise/internal/provision-runs/<run-id>/state.yaml
  rejected: .cruise/internal/rejected.yaml
  auth_job_transport_input: .cruise/internal/auth-jobs/<auth-id>.yaml
  auth_job_transport_input_immutable_after_first_write: true
  auth_job_state: .cruise/internal/auth-state/<auth-id>.yaml
  auth_job_state_path_is_separate: true
  exclude: .cruise/skills/exclude
  quarantine: .cruise/skills/quarantine/
  adapted: .cruise/skills/adapted/

state_io_bounds:
  exclusion:
    maximum_bytes: 262144
    maximum_entries: 4096
  rejected_capabilities:
    maximum_bytes: 1048576
    maximum_entries: 4096
  authentication_job:
    maximum_bytes: 1048576
    immutable_after_first_write: true
  authority_reads:
    regular_file_required: true
    symlink_forbidden: true
    canonical_path_must_remain_within_repository_root: true
    changed_during_read: rejected
