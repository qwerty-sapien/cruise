schema_version: 1
kind: cruise_provision_schema
visibility: private_internal_workflow
policy: policy.yaml
workflow: WORKFLOW.md

identifiers:
  request: "^CAPREQ-[0-9]{3,}$"
  capability_node: "^CAP-[A-Z0-9][A-Z0-9-]*$"
  authentication_job: "^AUTH-[0-9]{3,}$"
  decision: "^D-[0-9]{2,}$"
  run: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
  sha256: "^[a-f0-9]{64}$"
  immutable_commit: "^[a-f0-9]{40,64}$"
  local_skill: "^cruise-local-[a-z0-9][a-z0-9-]*$"

node_id_pattern: "^CAP-[A-Z0-9][A-Z0-9-]*$"
node_statuses:
  - pending
  - ready
  - running
  - waiting_auth
  - blocked
  - succeeded
  - failed
  - skipped
  - excluded
  - quarantined
run_outcomes:
  - pending
  - running
  - succeeded
  - waiting_auth
  - blocked
  - failed
resolution_order:
  - host_native
  - installed_plugin_or_skill
  - installed_local
  - official_codex_plugin
  - trusted_catalog
  - official_upstream_pinned
  - learning_only_adaptation
  - builtin_fallback
  - approval_or_block

enums:
  public_skill:
    - build
    - quick
    - refine
    - goal
    - debug
  consequence_level:
    - low
    - normal
    - high
    - critical
  latency_priority:
    - low
    - normal
    - high
  trust_tier:
    - official
    - allowlisted
    - established-community
    - uncertain
    - rejected
  candidate_stage:
    - metadata
    - filtered
    - isolated_review
    - security_reviewed
    - fit_evaluated
    - sandbox_tested
    - selected
    - activated
    - rejected
    - quarantined
  node_status:
    - pending
    - ready
    - running
    - waiting_auth
    - blocked
    - succeeded
    - failed
    - skipped
    - excluded
    - quarantined
  run_outcome:
    - pending
    - running
    - succeeded
    - waiting_auth
    - blocked
    - failed
  decision_action:
    - no_provisioning
    - external_discovery
  necessity:
    - optional
    - preferred
    - mandatory
  reconciliation_outcome:
    - equivalent_fallback
    - approved_alternate_plan_branch
    - contract_revision_required
    - blocked
  native_capability_source:
    - bundled_skills
    - installed_plugins
    - repository_local_skills
    - user_local_skills
    - administrative_skills
    - mcp_servers
    - connectors
    - subagent_definitions
    - installed_clis_and_analyzers
    - repository_scripts_and_tests
    - cruise_adaptations

records:
  capability_request:
    kind: cruise_capability_request
    additional_properties: false
    opaque_process_local_authority:
      - immutable_origin_digest
      - normalized_absolute_repository_root
      - granted_permission_decisions
      - exact_capability_request_object_identity
    creation_inputs_not_serialized:
      repository_root:
        absolute: true
        normalized_resolve_equality_required: true
        exact_value_bound_process_locally: true
    derived_authority_digest:
      algorithm: sha256
      canonical_input:
        - exact_capability_request_record
        - immutable_origin_digest
        - normalized_absolute_repository_root
        - granted_permission_decisions
      serialized_on_capability_request: false
      persisted_as: provision_run.request_authority_sha256
    required:
      - schema_version
      - request
    properties:
      schema_version:
        const: 1
      request:
        type: object
        additional_properties: false
        required:
          - id
          - originating_run
          - public_skill
          - task
          - gap
          - constraints
        properties:
          id:
            pattern_ref: request
          originating_run:
            pattern_ref: run
          public_skill:
            enum_ref: public_skill
          task:
            type: object
            additional_properties: false
            required:
              - summary
              - domains
              - languages
              - frameworks
              - consequence_level
            properties:
              summary:
                type: string
                min_length: 1
              domains:
                type: string_array
              languages:
                type: string_array
              frameworks:
                type: string_array
              consequence_level:
                enum_ref: consequence_level
          gap:
            type: object
            additional_properties: false
            required:
              - missing_competencies
              - missing_tools
              - missing_evidence_methods
              - why_base_codex_is_insufficient
              - expected_improvement
              - minimum_improvement_required
              - expected_success_delta
            properties:
              missing_competencies:
                type: string_array
              missing_tools:
                type: string_array
              missing_evidence_methods:
                type: string_array
              why_base_codex_is_insufficient:
                type: string_array
              expected_improvement:
                type: string_array
              minimum_improvement_required:
                type: number
                minimum: 0.10
                maximum: 1.0
              expected_success_delta:
                type: number
                minimum: 0.0
                maximum: 1.0
          constraints:
            type: object
            additional_properties: false
            required:
              - repository
              - permissions
              - maximum_install_scope
              - authentication_allowed
              - external_search_allowed
              - latency_priority
            properties:
              repository:
                type: string_array
              permissions:
                type: string_array
              maximum_install_scope:
                enum:
                  - repository-local
                  - none
              authentication_allowed:
                type: boolean
              external_search_allowed:
                type: boolean
              latency_priority:
                enum_ref: latency_priority

  process_local_authority_trust_root:
    current_runtime:
      constructor_factories_exported: true
      issuer_check: exact_string
      weakmap_tokens_prevent_serialized_shape_forgery: true
      same_process_malicious_importer_isolation: false
    deployment_requirement:
      - trusted_host_coordinator_controls_factory_imports
      - trusted_host_coordinator_controls_adapter_callbacks

  provision_decision:
    kind: cruise_provision_decision
    required:
      - schema_version
      - inventory
      - decision
      - external_search
    properties:
      schema_version:
        const: 1
      inventory:
        type: native_inventory
      decision:
        type: object
        required:
          - action
          - reason
        properties:
          action:
            enum:
              - no_provisioning
              - external_discovery
          reason:
            type: string
            min_length: 1
      external_search:
        type:
          - external_search
          - "null"
      gap_terms:
        type: string_array
      expected_delta:
        type: number
        minimum: -1.0
        maximum: 1.0
      total_cost:
        type: number
        minimum: 0.0
      candidates:
        type: array
      excluded_candidates:
        type: array

  effect_authorization:
    required:
      - allowed
      - permission_id
      - request_id
      - effect_kind
      - public_skill
    properties:
      allowed:
        const: true
      permission_id:
        pattern_ref: decision
      request_id:
        pattern_ref: request
      effect_kind:
        enum:
          - external_discovery
          - acquisition
          - install
          - authenticate
      public_skill:
        enum_ref: public_skill
    opaque_process_local_binding:
      - immutable_origin
      - exact_capability_request_object
      - exact_permission_decision
      - normalized_effect_target_fields
    serialized_fields_are_not_authority: true

  native_evaluation_broker:
    kind: cruise-provision-native-evaluation-broker
    serializable_authority: false
    opaque_process_local_binding:
      - exact_capability_request_object
      - trusted_native_review_adapter

  native_detailed_evaluation:
    additional_properties: false
    full_evaluation_required:
      - candidate_key
      - candidate_name
      - provider_source
      - source_path
      - revision
      - content_sha256
      - verified
      - fit_score
      - fit
      - repository_compatible
      - evidence_sha256
      - isolation_evidence_sha256
      - raw_instructions_exposed
    properties:
      candidate_key:
        pattern_ref: sha256
      candidate_name:
        type: string
        min_length: 1
      provider_source:
        enum_ref: native_capability_source
      source_path:
        type: string
        min_length: 1
      revision:
        type: string
        min_length: 1
      content_sha256:
        pattern_ref: sha256
      verified:
        type: boolean
      fit_score:
        type: integer
        minimum: 0
        maximum: 100
      fit:
        type: fit_assessment
      repository_compatible:
        type: boolean
      evidence_sha256:
        pattern_ref: sha256
      isolation_evidence_sha256:
        pattern_ref: sha256
      raw_instructions_exposed:
        const: false
    sparse_rejection_variant:
      required:
        - candidate_name
        - provider_source
        - verified
        - fit_score
        - repository_compatible
        - evidence_sha256
        - isolation_evidence_sha256
        - raw_instructions_exposed
        - reason
      reason: immutable_native_identity_unavailable
      evidence_sha256: null
      isolation_evidence_sha256: null
      authority_eligible: false

  external_selection:
    kind: cruise_native_first_external_selection
    serialized_shape_ref: provision_decision
    serializable_authority: false
    opaque_process_local_binding:
      - exact_capability_request_object
      - native_inventory
      - opaque_need_assessment
      - accepted_immutable_candidates
    required_before_acquisition: true

  native_inventory:
    kind: cruise_native_capability_inventory
    required:
      - stage_a_metadata
      - stage_b_relevant
      - stage_c_evaluations
      - native_candidate_sufficient
      - detailed_evaluation_limit
      - raw_instructions_loaded
      - sources_inspected
    properties:
      stage_a_metadata:
        type: array
        items_ref: native_capability_metadata
      stage_b_relevant:
        type: array
        items_ref: native_capability_metadata
      stage_c_evaluations:
        type: array
        max_items: 5
        items_ref: native_detailed_evaluation
      native_candidate_sufficient:
        type:
          - string
          - "null"
      detailed_evaluation_limit:
        const: 5
      raw_instructions_loaded:
        const: false
      sources_inspected:
        type: array
        min_items: 11
        max_items: 11
        items_ref: native_source_inspection

  native_source_inspection:
    required:
      - source
      - status
      - count
    properties:
      source:
        enum_ref: native_capability_source
      status:
        enum:
          - inspected
          - unavailable
      count:
        type: integer
        minimum: 0

  native_capability_metadata:
    required:
      - name
      - description
      - kind
      - source_path
      - version
      - revision
      - content_sha256
      - declared_dependencies
      - enabled
      - provenance
      - authentication_required
    properties:
      name:
        type: string
      description:
        type: string
      kind:
        type: string
      source_path:
        type:
          - string
          - "null"
      version:
        type:
          - string
          - "null"
      revision:
        type:
          - string
          - "null"
      content_sha256:
        type:
          - string
          - "null"
        pattern_ref: sha256
      declared_dependencies:
        type: string_array
      enabled:
        type: boolean
      provenance:
        type:
          - string
          - "null"
      authentication_required:
        type: boolean

  external_search:
    kind: cruise_external_capability_search
    required:
      - sources
      - queries
      - repositories_considered
      - repositories_rejected
      - stopping_condition
      - saturation_reached
      - exhaustive_internet_claimed
    properties:
      request_id:
        pattern_ref: request
      sources:
        type: string_array
      queries:
        type: string_array
      repositories_considered:
        type: string_array
      repositories_rejected:
        type: string_array
      stopping_condition:
        type: string
        min_length: 1
      saturation_reached:
        type: boolean
      exhaustive_internet_claimed:
        const: false

  candidate:
    required:
      - request_id
      - public_skill
      - authority_binding
      - decision
      - trust
      - acquisition
      - static_review
      - sandboxes
      - security_signals
      - fit
      - instruction_analysis
      - behavior_evaluation
      - activation
      - direct_activation_authority
      - raw_candidate_instructions_exposed
    properties:
      request_id:
        pattern_ref: request
      public_skill:
        enum_ref: public_skill
      authority_binding:
        type: object
        required:
          - origin_sha256
          - approved_permissions
          - required_permissions
          - maximum_install_scope
          - approved_install_scope
        properties:
          origin_sha256:
            pattern_ref: sha256
          approved_permissions:
            type: string_array
          required_permissions:
            type: string_array
          maximum_install_scope:
            enum:
              - repository-local
              - none
          approved_install_scope:
            enum:
              - repository-local
      decision:
        enum:
          - not_selected
          - rejected
          - direct_use_eligible
          - learning_only
      trust:
        type: trust_assessment
      acquisition:
        type: acquisition
      static_review:
        type: object
      sandboxes:
        type: object
      security_signals:
        type: security_signals
      fit:
        type: fit_assessment
      instruction_analysis:
        type:
          - object
          - "null"
      behavior_evaluation:
        type:
          - behavior_evaluation
          - "null"
      activation:
        type: activation_assessment
      direct_activation_authority:
        type: object
        required:
          - passed
          - use_context_sha256
          - authority_sha256
          - instruction_analysis
          - execution
        properties:
          passed:
            type: boolean
          use_context_sha256:
            pattern_ref: sha256
          authority_sha256:
            type:
              - string
              - "null"
          instruction_analysis:
            type: object
            challenge_bound_live_probe_required: true
          execution:
            type: object
            challenge_bound_live_probe_required: true
      raw_candidate_instructions_exposed:
        const: false

  trust_allowlist_snapshot:
    serializable_authority: false
    opaque_process_local_binding:
      - exact_capability_request_object
    maximum_entries: 100
    entry_required:
      - owner
      - repository
      - capability
      - commit_sha
      - content_sha256
      - release_process
      - installation_path
    exact_match_required: true
    installation_path:
      const: repository-local

  trust_assessment:
    required:
      - tier
      - stars_at_evaluation
      - stars_evaluated_at
      - stars_source
      - publisher_verified
      - allowlisted
      - security_review_complete
      - direct_install_eligible
      - learning_only
    properties:
      tier:
        enum_ref: trust_tier
      stars_at_evaluation:
        type:
          - integer
          - "null"
        minimum: 0
      stars_evaluated_at:
        type:
          - datetime
          - "null"
      stars_source:
        type:
          - string
          - "null"
      publisher_verified:
        type: boolean
      allowlisted:
        type: boolean
      security_review_complete:
        type: boolean
      direct_install_eligible:
        type: boolean
      learning_only:
        type: boolean

  acquisition:
    projection: reviewed_candidate_evaluation
    required:
      - identity
      - repository
      - canonical_url
      - commit_sha
      - content_sha256
      - retrieved_at
      - stars
      - license
      - files_examined
      - review_closure_complete
      - unexamined_review_closure
      - execution_closure_complete
      - unexamined_execution_closure
      - submodules_fetched
      - lfs_materialized
      - code_executed
    properties:
      identity:
        type: string
        min_length: 1
      repository:
        type:
          - string
          - "null"
      canonical_url:
        type:
          - string
          - "null"
      commit_sha:
        type:
          - string
          - "null"
        pattern_ref: immutable_commit
      content_sha256:
        type:
          - string
          - "null"
        pattern_ref: sha256
      retrieved_at:
        type:
          - datetime
          - "null"
      stars:
        type:
          - integer
          - "null"
      license:
        type:
          - string
          - "null"
      files_examined:
        type: string_array
      review_closure_complete:
        type: boolean
      unexamined_review_closure:
        type: string_array
      execution_closure_complete:
        type: boolean
      unexamined_execution_closure:
        type: string_array
      submodules_fetched:
        const: false
      lfs_materialized:
        const: false
      code_executed:
        const: false

  quarantined_acquisition_metadata:
    required:
      - repository
      - canonical_url
      - commit_sha
      - retrieved_at
      - stars
      - stars_source
      - stars_verified
      - official
      - publisher_verified
      - canonical_identity_verified
      - license
      - files_examined
      - content_sha256
      - submodules_fetched
      - lfs_materialized
      - code_executed
      - checkout_created
      - hooks_executed
      - packages_installed
      - tree_findings
      - tree_signals
      - execution_closure_complete
      - unexamined_execution_closure
      - review_closure_complete
      - unexamined_review_closure
      - request_id
      - public_skill
      - security_signals
      - hosting_api_source
    immutable_identity:
      - repository
      - canonical_url
      - commit_sha
      - content_sha256
    inert_flags:
      submodules_fetched: false
      lfs_materialized: false
      code_executed: false
      checkout_created: false
      hooks_executed: false
      packages_installed: false

  acquisition_handle:
    kind: cruise_quarantined_acquisition_handle
    serializable_authority: false
    exposed_shape:
      required:
        - acquisition
        - quarantine
      properties:
        acquisition:
          type: quarantined_acquisition_metadata
        quarantine:
          type: object
    opaque_process_local_binding:
      - exact_capability_request_object
      - exact_external_selection_object
      - exact_acquisition_effect_authorization
      - immutable_origin_digest
      - exclusion_root_and_digest
      - repository
      - canonical_url
      - immutable_commit
      - content_sha256
      - quarantined_blob_bytes
    repository_authority:
      exclusion_root_must_equal_exact_capability_request_root: true
      quarantine_persistence_root_must_equal_exact_capability_request_root: true
      exclusion_digest_rechecked_before_persistence: true
    activation_during_acquisition: false

  hosting_api_broker:
    kind: cruise-provision-hosting-api-broker
    serializable_authority: false
    opaque_process_local_binding:
      - verified_provider_source
      - allowed_repository_hosts
      - repository_metadata_adapter
      - immutable_commit_adapter
      - bounded_tree_adapter
      - bounded_blob_adapter

  installer_attestation:
    kind: cruise-trusted-installer-attestation
    exposed_fields:
      - kind
      - command_file
      - observed_at
    serializable_authority: false
    opaque_process_local_binding:
      - absolute_resolved_executable_path
      - executable_file_sha256
      - regular_file
      - non_symlink
      - executable
      - synchronous_reinspection_adapter

  install_execution_broker:
    kind: cruise-provision-install-execution-broker
    serializable_authority: false
    opaque_process_local_binding:
      - exact_capability_request_object
      - canonical_repository_root
      - trusted_execution_adapter

  install_execution_result:
    serializable_authority: false
    required:
      - ok
      - exitCode
      - identity
      - version
      - revision
      - command_sha256
      - file_change_log_sha256
      - isolation_evidence_sha256
      - written_paths
      - repository_root
      - managed_install_root
    properties:
      ok:
        const: true
      exitCode:
        const: 0
      identity:
        type: string
        min_length: 1
      version:
        type:
          - string
          - "null"
      revision:
        type:
          - string
          - "null"
      command_sha256:
        pattern_ref: sha256
      file_change_log_sha256:
        pattern_ref: sha256
      isolation_evidence_sha256:
        pattern_ref: sha256
      written_paths:
        type: string_array
        absolute_paths_within_managed_install_root: true
      repository_root:
        type: string
        absolute_canonical_path: true
      managed_install_root:
        type: string
        absolute_path_within_repository_root: true
    opaque_process_local_binding:
      - exact_install_execution_broker
      - exact_capability_request_object
      - provision_run_id
      - capability_node_id
      - direct_use_evaluation
      - install_effect_authorization

  smoke_verification_broker:
    kind: cruise-provision-smoke-verification-broker
    serializable_authority: false
    opaque_process_local_binding:
      - exact_capability_request_object
      - canonical_repository_root
      - trusted_probe_adapter

  smoke_verification_result:
    required:
      - ok
      - identity
      - version
      - revision
      - version_unavailable_reason
      - scope
      - evidence
      - probe_sha256
      - artifact_sha256
      - observed_paths
    properties:
      ok:
        type: boolean
      identity:
        type: string
      version:
        type:
          - string
          - "null"
      revision:
        type:
          - string
          - "null"
      version_unavailable_reason:
        type:
          - string
          - "null"
      scope:
        type:
          - object
          - array
          - string
      evidence:
        type:
          - object
          - array
          - string
      reason:
        type:
          - string
          - "null"
      probe_sha256:
        pattern_ref: sha256
      artifact_sha256:
        pattern_ref: sha256
      observed_paths:
        type: string_array
        absolute_paths: true
        install_action_requires_paths_within_managed_install_root: true
    broker_call_binding:
      - exact_capability_request_object
      - provision_run_id
      - capability_node
      - candidate
      - opaque_install_execution_result_when_installing

  rollback_execution_broker:
    kind: cruise-provision-rollback-broker
    serializable_authority: false
    opaque_process_local_binding:
      - exact_capability_request_object
      - repository_root_equal_to_capability_request_repository
      - trusted_rollback_adapter

  rollback_execution_result:
    required:
      - ok
      - reason
      - rollback_contract_sha256
      - rollback_evidence_sha256
      - file_change_log_sha256
      - observed_paths
    properties:
      ok:
        type: boolean
      reason:
        type:
          - string
          - "null"
      rollback_contract_sha256:
        pattern_ref: sha256
      rollback_evidence_sha256:
        pattern_ref: sha256
      file_change_log_sha256:
        pattern_ref: sha256
      observed_paths:
        type: string_array
        min_items: 1
        max_items: 256
        absolute_paths_within_managed_install_root: true
    contract_digest_input:
      - request_authority_sha256
      - provision_run_id
      - capability_node_id
      - candidate_identity_version_and_revision
      - rollback_safe_true
      - rollback_procedure_sha256
      - install_command_sha256
      - install_file_change_log_sha256
      - install_isolation_evidence_sha256
      - managed_install_root
    broker_call_binding:
      - exact_capability_request_object
      - provision_run_id
      - capability_node
      - exact_direct_use_candidate
      - opaque_install_execution_result
      - exact_install_effect_authorization

  instruction_analysis:
    required:
      - declared_purpose
      - useful_learning_points
      - required_tools
      - required_permissions
      - verification_methods
      - unsafe_instructions
      - prompt_injection_indicators
      - technical_errors
      - repository_mismatches
      - candidate_fit_score
      - confidence
    properties:
      declared_purpose:
        type: string
      useful_learning_points:
        type: string_array
      required_tools:
        type: string_array
      required_permissions:
        type: string_array
      verification_methods:
        type: string_array
      unsafe_instructions:
        type: string_array
      prompt_injection_indicators:
        type: string_array
      technical_errors:
        type: string_array
      repository_mismatches:
        type: string_array
      candidate_fit_score:
        type: number
        minimum: 0
