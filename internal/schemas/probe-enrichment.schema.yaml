schema_version: 1
type: object
additional_properties: false
required:
  - schema_version
  - prompt_sha256
  - repository_baseline_digest
  - assessed_quick_gates
  - facts
quick_hard_gates:
  - public_api_change
  - abi_change
  - authentication_or_authorization
  - cryptography_secrets_or_privacy
  - data_or_serialization_migration
  - dependency_change
  - concurrency_ordering_cancellation_or_lifecycle
  - build_deployment_packaging_release_or_ci
  - unknown_indirect_callers
  - reflection_registration_or_dynamic_dispatch
  - meaningful_external_side_effects
  - insufficient_testability
  - repository_evidence_conflict
  - scope_materially_exceeded
  - failed_quick_repairs
  - root_cause_unknown
  - requires_external_research
  - material_design_choice
fact:
  id_sequence: "PF-01 through PF-18 in quick_hard_gates order"
  required_coverage: "exactly one evidence-bound verdict for every Quick hard gate"
  values: "boolean, except failed_quick_repairs which is non-negative append-only telemetry; promotion follows semantic gates or an explicit workflow stop condition, never a universal count"
  minimum_facts: 18
  maximum_facts: 18
  immutable_order_and_identity: "facts[n].id and facts[n].signal must match PF-(n+1) and quick_hard_gates[n]"
  maximum_bases_per_fact: 8
  basis_kinds:
    prompt_span: "locator bytes:<start>:<end>; SHA-256 is verified against exact raw prompt bytes"
    repository_file: "repository-relative regular non-symlink; SHA-256 is verified against current bytes"
    repository_baseline: "literal repository_baseline locator; SHA-256 equals immutable baseline digest"
budgets:
  git_command_timeout_ms: 10000
  git_command_max_bytes: 8388608
  prompt_max_bytes: 4194304
  semantic_evidence_file_max_bytes: 1048576
  semantic_evidence_total_max_bytes: 4194304
