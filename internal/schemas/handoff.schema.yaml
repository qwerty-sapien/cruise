type: object
additionalProperties: false
required:
  - schema_version
  - kind
  - id
  - created_at
  - source_route
  - target_route
  - trigger
  - reason
  - semantic_reasons
  - evidence_ids
  - origin_path
  - route_history
  - hop_count
  - parent_handoff_id
  - recursive_routing
  - authorizes_product_edits
  - authorizes_goal_activation
  - goal_activation_requirement
properties:
  schema_version:
    const: 1
  kind:
    const: cruise_public_route_handoff
  id:
    type: string
    pattern: '^HO-[0-9]{2,}$'
  created_at:
    type: string
    format: date-time
  source_route:
    type: string
    enum:
      - build
      - quick
      - refine
      - goal
      - debug
      - research
      - review
  target_route:
    type: string
    enum:
      - build
      - quick
      - refine
      - goal
      - debug
      - research
      - review
  trigger:
    type: string
    enum:
      - semantic_promotion
      - route_mismatch
      - explicit_user_request
      - review_remediation
      - research_implementation
  reason:
    type: string
    minLength: 1
  semantic_reasons:
    type: array
    uniqueItems: true
    maxItems: 64
    items:
      type: string
      minLength: 1
  evidence_ids:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      pattern: '^E-[0-9]{2,}$'
  origin_path:
    type: string
    minLength: 1
  route_history:
    type: array
    minItems: 2
    maxItems: 2
    uniqueItems: true
    items:
      type: string
      enum:
        - build
        - quick
        - refine
        - goal
        - debug
        - research
        - review
  hop_count:
    const: 1
  parent_handoff_id:
    const: null
  recursive_routing:
    const: false
  authorizes_product_edits:
    const: false
  authorizes_goal_activation:
    const: false
  goal_activation_requirement:
    type: string
    enum:
      - not_applicable
      - separate_Approve_Plan_then_Start_Cruise_required
