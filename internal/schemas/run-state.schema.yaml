type: object
additionalProperties: false
required:
  - schema_version
  - kind
  - run_id
  - selected_skill
  - current_route
  - status
  - created_at
  - updated_at
  - model_attempts
  - repair_attempts
  - waiting_capabilities
  - history
properties:
  schema_version:
    const: 1
    type: integer
  kind:
    const: cruise_run_state
    type: string
  run_id:
    type: string
    maxLength: 15
    pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
  selected_skill:
    type: string
    enum:
      - build
      - quick
      - refine
      - goal
      - debug
      - review
      - research
  current_route:
    type: string
    enum:
      - build
      - quick
      - refine
      - goal
      - debug
      - review
      - research
  status:
    type: string
    enum:
      - routing_pending
      - routed
      - executing
      - waiting_auth
      - blocked
      - completed
      - completed_waiver_qualified
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  model_attempts:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - requested
        - resolved
        - degraded
        - attempt
        - escalation
      properties:
        requested:
          type: object
          additionalProperties: false
          required:
            - model
            - reasoning_effort
          properties:
            model:
              type: string
              minLength: 1
            reasoning_effort:
              type: string
              minLength: 1
        resolved:
          type: object
          additionalProperties: false
          required:
            - model
            - reasoning_effort
          properties:
            model:
              type:
                - string
                - "null"
              minLength: 1
            reasoning_effort:
              type:
                - string
                - "null"
              minLength: 1
        degraded:
          type: boolean
        attempt:
          type: integer
          minimum: 1
        escalation:
          type:
            - string
            - "null"
          minLength: 1
  repair_attempts:
    type: integer
    minimum: 0
  waiting_capabilities:
    type: array
    uniqueItems: true
    items:
      type: string
      pattern: "^CAP-[A-Z0-9][A-Z0-9-]*$"
  history:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - sequence
        - from_status
        - to_status
        - from_route
        - to_route
        - at
        - reason
        - repair_attempts
        - model_attempt_count
        - waiting_capabilities
      properties:
        sequence:
          type: integer
          minimum: 1
        from_status:
          type:
            - string
            - "null"
          enum:
            - null
            - routing_pending
            - routed
            - executing
            - waiting_auth
            - blocked
            - completed
            - completed_waiver_qualified
        to_status:
          type: string
          enum:
            - routing_pending
            - routed
            - executing
            - waiting_auth
            - blocked
            - completed
            - completed_waiver_qualified
        from_route:
          type:
            - string
            - "null"
          enum:
            - null
            - build
            - quick
            - refine
            - goal
            - debug
            - review
            - research
        to_route:
          type: string
          enum:
            - build
            - quick
            - refine
            - goal
            - debug
            - review
            - research
        at:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 1
        repair_attempts:
          type: integer
          minimum: 0
        model_attempt_count:
          type: integer
          minimum: 0
        waiting_capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: "^CAP-[A-Z0-9][A-Z0-9-]*$"
