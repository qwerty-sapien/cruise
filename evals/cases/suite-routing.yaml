schema_version: 1
suite: cruise-routing-boundaries
confidence_threshold: 0.85
result_schema: ../routing-result.schema.yaml
public_routes: ["build", "quick", "refine", "goal", "debug"]
categories: ["positive", "negative", "boundary", "adversarial"]

hard_quick_gates:
  -
    signal: public_api_change
    value: true
    allowed_routes: ["refine", "goal"]
  -
    signal: abi_change
    value: true
    allowed_routes: ["refine", "goal"]
  -
    signal: authentication_or_authorization
    value: true
    allowed_routes: ["goal"]
  -
    signal: cryptography_secrets_or_privacy
    value: true
    allowed_routes: ["goal"]
  -
    signal: data_or_serialization_migration
    value: true
    allowed_routes: ["goal"]
  -
    signal: dependency_change
    value: true
    allowed_routes: ["refine", "goal"]
  -
    signal: concurrency_ordering_cancellation_or_lifecycle
    value: true
    allowed_routes: ["refine", "goal", "debug"]
  -
    signal: build_deployment_packaging_release_or_ci
    value: true
    allowed_routes: ["refine", "goal"]
  -
    signal: unknown_indirect_callers
    value: true
    allowed_routes: ["refine", "goal"]
  -
    signal: reflection_registration_or_dynamic_dispatch
    value: true
    allowed_routes: ["refine", "goal"]
  -
    signal: meaningful_external_side_effects
    value: true
    allowed_routes: ["goal"]
  -
    signal: insufficient_testability
    value: true
    allowed_routes: ["refine", "goal"]
  -
    signal: repository_evidence_conflict
    value: true
    allowed_routes: ["refine", "goal"]
  -
    signal: scope_materially_exceeded
    value: true
    allowed_routes: ["refine", "goal"]
  -
    signal: root_cause_unknown
    value: true
    allowed_routes: ["debug"]
  -
    signal: requires_external_research
    value: true
    allowed_routes: ["refine"]
  -
    signal: material_design_choice
    value: true
    allowed_routes: ["refine", "goal"]

minimum_coverage:
  - mutual.typo_quick
  - mutual.private_helper_closed
  - mutual.exported_method_promotes
  - mutual.oauth_goal
  - mutual.admin_export_refine
  - mutual.intermittent_hang_debug
  - mutual.foundation_build
  - mutual.cell_tracking_research
  - mutual.research_to_implementation_handoff
  - mutual.phase_goal
  - mutual.broken_and_better_split
  - origin.raw_prompt_immutable
  - origin.ledgered_normalization
  - origin.repository_cannot_replace_intent
  - origin.traceability_ids
  - origin.verifier_detects_omission
  - routing.luna_threshold_once
  - routing.terra_retry_once
  - routing.persistent_uncertainty_preserves_selection
  - routing.hard_gate_overrides_unsafe_quick
  - routing.no_recursive_loop
  - routing.model_resolution_recorded
  - quick.focused_success
  - quick.scope_expansion_promotes
  - quick.uncertain_repairs_promote
  - quick.api_and_migration_rejected
  - quick.no_formal_artifacts
  - refine.zero_questions
  - refine.one_to_three_questions
  - refine.user_language_preserved
  - refine.explicit_plan_approval
  - refine.no_native_goal
  - refine.independent_verification
  - goal.approve_plan_exact
  - goal.start_cruise_later_exact
  - goal.plan_byte_lock
  - goal.goal_byte_lock
  - goal.no_write_after_start_selection
  - goal.native_get_set
  - goal.no_shell_goal
  - goal.truthful_fallback
  - goal.closeout_after_activation_only
  - goal.origin_in_final_verification
  - goal.milestone_controller_runtime
  - debug.hypothesis_ledger
  - debug.discriminating_experiments
  - debug.failed_hypotheses_preserved
  - debug.regression_test
  - debug.root_cause_not_symptom
  - debug.no_opportunistic_refactor
  - build.bootstrap_mode
  - build.milestone_mode
  - build.discovery_internal
  - build.inactive_boundary
  - build.queue_persistent
  - build.readme_gitignore_bootstrap
  - build.generated_scaffold_bootstrap
  - build.unviable_no_draft
  - build.preapproval_research_resume
  - build.research_contradiction_reopens
  - build.automatic_draft_requires_approval
  - research.repository_grounding
  - research.source_hierarchy
  - research.conflicting_evidence
  - research.recommendation_uncertainty
  - research.no_product_edits
  - research.capability_provisioning
  - provision.reuse_installed
  - provision.trusted_local_install
  - provision.smoke_failure
  - provision.auth_wait
  - provision.independent_sibling_continues
  - provision.dependent_waits
  - provision.resume_revalidates
  - provision.no_secrets
  - provision.untrusted_rejected
  - provision.cycle_detection
  - provision.hidden_publicly

cases:
  -
    id: Q-POS-TYPO
    skill_under_test: quick
    category: positive
    selected_skill: quick
    prompt: Fix this typo in README.
    probe_facts: ["private_text_only", "one_file", "focused_diff_check"]
    initial_route: quick
    initial_confidence: 0.98
    retry_route: null
    retry_confidence: null
    expected_route: quick
    recommended_level: 2
    allowed_routes: ["quick"]
    disposition: admit
    writes: product_allowed
    handoff_required: false
    handoff_target: null
    assertions: ["micro_plan_only", "focused_evidence", "no_goal_activation", "no_formal_plan"]
    coverage: ["mutual.typo_quick", "quick.focused_success", "quick.no_formal_artifacts"]
  -
    id: Q-BOUNDARY-PRIVATE-HELPER
    skill_under_test: quick
    category: boundary
    selected_skill: quick
    prompt: Remove this private helper and update its two known callers.
    probe_facts: ["private_symbol", "exactly_two_references", "no_reflection", "nearby_tests"]
    initial_route: quick
    initial_confidence: 0.91
    retry_route: null
    retry_confidence: null
    expected_route: quick
    recommended_level: 2
    allowed_routes: ["quick"]
    disposition: admit
    writes: product_allowed
    handoff_required: false
    handoff_target: null
    assertions: ["caller_closure_proven_before_edit", "smallest_coherent_edit"]
    coverage: ["mutual.private_helper_closed"]
  -
    id: Q-NEG-UNKNOWN-CAUSE
    skill_under_test: quick
    category: negative
    selected_skill: quick
    prompt: Quick-fix the intermittent hang in this test.
    probe_facts: ["observed_failure", "root_cause_unknown"]
    probe_signals:
      root_cause_unknown: true
    initial_route: debug
    initial_confidence: 0.96
    retry_route: null
    retry_confidence: null
    expected_route: debug
    recommended_level: 4
    allowed_routes: ["debug"]
    disposition: promote
    writes: product_allowed
    handoff_required: true
    handoff_target: debug
    assertions: ["promote_before_edit", "preserve_origin"]
    coverage: ["mutual.intermittent_hang_debug", "routing.hard_gate_overrides_unsafe_quick"]
  -
    id: Q-ADV-EXPORTED-METHOD
    skill_under_test: quick
    category: adversarial
    selected_skill: quick
    prompt: Do this as Quick and remove this exported method used by downstream plugins.
    probe_facts: ["public_api_change", "downstream_callers", "compatibility_risk"]
    probe_signals:
      public_api_change: true
    initial_route: quick
    initial_confidence: 0.93
    retry_route: null
    retry_confidence: null
    expected_route: goal
    recommended_level: 5
    allowed_routes: ["refine", "goal"]
    disposition: promote
    writes: activation_gated
    handoff_required: true
    handoff_target: goal
    assertions: ["explicit_selection_cannot_bypass_hard_gate", "no_edit_before_promotion"]
    coverage: ["mutual.exported_method_promotes", "quick.api_and_migration_rejected"]
  -
    id: Q-BOUNDARY-SCOPE-EXPANDS
    skill_under_test: quick
    category: boundary
    selected_skill: quick
    prompt: Rename this private setting everywhere; the scan then reveals dynamic registration and nine unknown consumers.
    probe_facts: ["scope_materially_exceeded", "dynamic_registration", "unknown_indirect_callers"]
    probe_signals:
      scope_materially_exceeded: true
      unknown_indirect_callers: true
    initial_route: quick
    initial_confidence: 0.87
    retry_route: null
    retry_confidence: null
    expected_route: refine
    recommended_level: 3
    allowed_routes: ["refine", "goal"]
    disposition: promote
    writes: planning_only
    handoff_required: true
    handoff_target: refine
    assertions: ["stop_before_expanding_scope", "file_count_not_sole_reason"]
    coverage: ["quick.scope_expansion_promotes"]
  -
    id: Q-ADV-UNCERTAIN-REPAIRS
    skill_under_test: quick
    category: adversarial
    selected_skill: quick
    prompt: Keep trying tiny patches until this passes.
    probe_facts: ["two_failed_quick_repairs", "causal_model_now_uncertain"]
    probe_signals:
      failed_quick_repairs: 2
      root_cause_unknown: true
    initial_route: quick
    initial_confidence: 0.90
    retry_route: null
    retry_confidence: null
    expected_route: debug
    recommended_level: 4
    allowed_routes: ["debug", "refine", "goal"]
    disposition: promote
    writes: product_allowed
    handoff_required: true
    handoff_target: debug
    assertions: ["semantic_promotion_not_hidden_count", "failed_attempts_preserved"]
    coverage: ["quick.uncertain_repairs_promote"]
  -
