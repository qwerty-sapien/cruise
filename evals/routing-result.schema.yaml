type: object
additionalProperties: false
required: ["schema_version", "case_id", "observed_route", "recommended_level", "disposition", "classifier_attempts", "promotion_reasons", "handoff", "writes", "checks", "evidence"]
properties:
  schema_version:
    const: 1
  case_id:
    type: string
    pattern: "^[A-Z][A-Z0-9-]{2,}$"
  observed_route:
    type: string
    enum: ["build", "quick", "refine", "goal", "debug", "research"]
  recommended_level:
    type: integer
    minimum: 2
    maximum: 7
  disposition:
    type: string
    enum: ["admit", "promote", "handoff", "preserve_selection", "review_then_handoff", "split", "block", "wait_auth", "continue_independent"]
  classifier_attempts:
    type: array
    minItems: 1
    maxItems: 2
    items:
      type: object
      additionalProperties: false
      required: ["attempt", "policy_tier", "reasoning", "route", "recommended_level", "confidence", "model_resolution_recorded"]
      properties:
        attempt:
          type: integer
          minimum: 1
          maximum: 2
        policy_tier:
          type: string
          enum: ["luna", "terra"]
        reasoning:
          const: medium
        route:
          type: string
          enum: ["build", "quick", "refine", "goal", "debug", "research"]
        recommended_level:
          type: integer
          minimum: 2
          maximum: 7
        confidence:
          type: number
          minimum: 0
          maximum: 1
        model_resolution_recorded:
          type: boolean
  promotion_reasons:
    type: array
    uniqueItems: true
    items:
      type: string
      minLength: 1
  handoff:
    type: object
    additionalProperties: false
    required: ["required", "target", "reason"]
    properties:
      required:
        type: boolean
      target:
        type: ["string", "null"]
        enum: ["build", "quick", "refine", "goal", "debug", "research", null]
      reason:
        type: ["string", "null"]
  writes:
    type: string
    enum: ["product_allowed", "product_forbidden", "activation_gated", "planning_only", "none"]
  checks:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: ["id", "status", "evidence_ids"]
      properties:
        id:
          type: string
          minLength: 1
        status:
          type: string
          enum: ["PASS", "BLOCK", "NOT_RUN"]
        evidence_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: "^E-[0-9]{2,}$"
  evidence:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: ["id", "kind", "observation"]
      properties:
        id:
          type: string
          pattern: "^E-[0-9]{2,}$"
        kind:
          type: string
          enum: ["probe", "classifier", "repository", "test", "diff", "source", "approval", "native_state", "scheduler", "auth", "static"]
        observation:
          type: string
          minLength: 1
