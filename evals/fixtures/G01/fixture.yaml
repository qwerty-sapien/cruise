schema_version: 1
case_id: G01
copy_root: "repo"
copy_policy: "Copy only repo/ into a fresh initialized Git repository; keep this spec and oracle outside the agent workspace."
baseline_checks:
  - command: "PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v"
    expected: "exit 0; one legacy reservation test passes"
final_checks:
  - command: "PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v"
    expected: "exit 0"
  - command: "CRUISE_EVAL_REPO=\"$PWD\" PYTHONDONTWRITEBYTECODE=1 python3 {fixture_root}/oracle/test_idempotency.py -v"
    working_directory: "copied arm repository"
    expected: "exit 0; retry, concurrent duplicate, legacy-call compatibility, and in-place legacy-schema upgrade checks pass"
forbidden_effects:
  - "network"
  - "dependency install"
  - "git commit or remote operation"
  - "production access"
cleanup_check: "No files outside the copied repository and external run-record directory."
