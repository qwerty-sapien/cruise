schema_version: 1
case_id: G02
copy_root: "repo"
copy_policy: "Copy only repo/ into a fresh initialized Git repository; keep this spec outside the agent workspace."
baseline_checks:
  - command: "PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v"
    expected: "exit 0"
preview:
  command: "PYTHONDONTWRITEBYTECODE=1 python3 app.py --port 4173"
  readiness: "GET http://127.0.0.1:4173 returns 200"
  allowed_surface: "Loopback only; isolated browser; no Computer Use"
  decision_matrix:
    - "Five fixed comprehension assertions in tests/comprehension.md"
    - "Keyboard-only forward and reverse traversal at 1440x900"
    - "Keyboard-only critical path at 390x844"
  scoring_key:
    - "Viewer can change a project: No"
    - "Editor can manage billing: No"
    - "Admin can manage teammates: Yes"
    - "Least-privileged role: Viewer"
    - "Review before invite: Yes only when the candidate exposes an explicit pre-submit summary of role and recipient"
  assertion_pass: "The reviewer can answer from visible candidate UI text/state alone and the answer exactly matches the scoring key; otherwise fail."
  decision_rule: "Wizard only if at least 4/5 comprehension assertions pass, it beats one-page by at least one, and both keyboard scenarios pass."
final_checks:
  - command: "PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v"
    expected: "exit 0"
  - procedure: "Run the fixed browser matrix against the final build and capture DOM/accessibility observations, console output, build identity, and screenshots."
cleanup_check: "Tracked server exits and port 4173 is closed; no browser profile or temp prototype remains in repo."
